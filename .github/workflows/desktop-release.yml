name: Desktop Release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "desktop-v$version") { throw 'Tag and desktop version must match' }
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - name: Package installer and update metadata
        run: npx electron-builder --win nsis --x64 --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            dist/desktop/*-Setup.exe
            dist/desktop/*.blockmap
            dist/desktop/latest.yml
      - name: Publish desktop release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $notes = @"
          Windows x64 desktop release with an installation wizard and in-app updates.

          Download and run the Setup.exe asset. The app checks for updates on startup; use Application > Check for updates to check manually.

          AI disclosure: Developed with OpenAI Codex (GPT-6 family).
          "@
          $notes | Set-Content -Encoding utf8 release-notes.md
          gh release create $env:GITHUB_REF_NAME --verify-tag --title "Desktop $version" --notes-file release-notes.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
          gh release upload $env:GITHUB_REF_NAME dist/desktop/*-Setup.exe dist/desktop/*.blockmap dist/desktop/latest.yml
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
